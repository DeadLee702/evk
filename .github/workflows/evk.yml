name: EVK Canonicalization Gate
on: [push, workflow_dispatch]

jobs:
  canonical:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Pack bundle
        run: ./target/release/evk pack --json   # adjust flags if your pack command needs different args

      - name: SHA256 of bundle
        run: shasum -a 256 ${{ matrix.os }}.evkp

      - name: Verify MUST be VALID
        run: |
          set -o pipefail
          
          echo "=== Running verification ==="
          ./target/release/evk verify --bundle ${{ matrix.os }}.evkp --cert 2>&1 | tee cert.txt
          
          echo "=== VERIFICATION RESULT ==="
          cat cert.txt
          
          if grep -q "Status: VALID" cert.txt; then
            echo "✅ Verification PASSED on ${{ matrix.os }}"
          else
            echo "❌ Verification FAILED on ${{ matrix.os }}"
            exit 1
          fi

      - name: DEBUG - Show both certs as help
        if: always()
        run: |
          echo "=== EXPECTED CERT ==="
          if [ -f tests/expected_cert.txt ]; then
            cat tests/expected_cert.txt
          else
            echo "No expected_cert.txt found"
          fi
          echo "=== ACTUAL CERT ==="
          cat cert.txt || echo "No cert.txt generated"
