name: EVK Canonicalization Gate
on: [push, workflow_dispatch]

jobs:
  canonical:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Pack bundle
        run: ./target/release/evk pack --job tests/job.evk --snapshot tests/snapshot.evk --input tests/input.bin --output ${{ matrix.os }}.evkp

      - name: SHA256 of bundle
        run: shasum -a 256 ${{ matrix.os }}.evkp > ${{ matrix.os }}.sha256

      - name: Verify MUST be VALID
        run: ./target/release/evk verify --bundle ${{ matrix.os }}.evkp

      - name: Flip 1 byte, MUST be INVALID
        run: |
          cp ${{ matrix.os }}.evkp broken.evkp
          printf '\xFF' | dd of=broken.evkp bs=1 seek=100 count=1 conv=notrunc
          ./target/release/evk verify --bundle broken.evkp 2>&1 | grep -i -E "INVALID|REJECTED|ERROR"

      - uses: actions/upload-artifact@v4
        with:
          name: evkp-${{ matrix.os }}
          path: ${{ matrix.os }}.evkp
          retention-days: 1

  cross-check:
    needs: canonical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
      - name: Byte-identical across arch
        run: diff evkp-ubuntu-latest/ubuntu-latest.evkp evkp-macos-latest/macos-latest.evkp
      - name: Verify Mac bundle on Linux
        run: ./target/release/evk verify --bundle evkp-macos-latest/macos-latest.evkp
