name: Z-12 Demo CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  demo:
    name: Run Z-12 demo pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout EVK (this repo)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: evk

      - name: Checkout Gemini-Box
        uses: actions/checkout@v4
        with:
          repository: DeadLee702/gemini-box
          path: gemini-box

      - name: Checkout Adversarial Compliance Matrix
        uses: actions/checkout@v4
        with:
          repository: DeadLee702/adversarial-compliance-matrix
          path: adversarial-compliance-matrix

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip build-essential make unzip

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Verify Python & Rust
        run: |
          python3 --version
          cargo --version

      - name: Run deterministic demo pipeline (bash)
        working-directory: evk
        run: |
          chmod +x ./run_z12_pipeline.sh
          ./run_z12_pipeline.sh

      - name: Run z12 Python orchestrator (optional)
        working-directory: evk
        run: |
          chmod +x ./z12
          ./z12 demo || true

      - name: Upload Z-12 reports
        uses: actions/upload-artifact@v4
        with:
          name: z12-reports
          path: |
            evk/z12_demo_report](#)
