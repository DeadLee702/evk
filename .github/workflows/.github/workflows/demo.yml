name: Z-12 Demo CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  demo:
    name: Run Z-12 demo pipeline
    runs-on: ubuntu-latest
    env:
      # deterministic demo epoch (can be overridden)
      SOURCE_DATE_EPOCH: 1700000000

    steps:
      - name: Checkout EVK (this repo)
        uses: actions/checkout@v4
        with:
          path: evk

      - name: Checkout Gemini-Box
        uses: actions/checkout@v4
        with:
          repository: DeadLee702/gemini-box
          path: gemini-box

      - name: Checkout Adversarial Compliance Matrix
        uses: actions/checkout@v4
        with:
          repository: DeadLee702/adversarial-compliance-matrix
          path: adversarial-compliance-matrix

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip build-essential make unzip

      - name: Install TPM system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libtss2-dev pkg-config libssl-dev

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache Cargo registry + index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target (release)
        uses: actions/cache@v4
        with:
          path: evk/target
          key: ${{ runner.os }}-evk-target-${{ hashFiles('evk/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-evk-target-

      - name: Verify tool availability
        run: |
          python3 --version
          cargo --version

      - name: Build & Test (EVK)
        working-directory: evk
        run: |
          cargo build --release --locked
          cargo test --release --locked -- --nocapture

      - name: Build (Gemini-Box)
        working-directory: gemini-box
        run: cargo build --release --locked

      - name: Build (Adversarial Compliance Matrix)
        working-directory: adversarial-compliance-matrix
        run: cargo build --release --locked

      - name: Run deterministic demo pipeline (bash)
        working-directory: evk
        run: |
          chmod +x ./run_z12_pipeline.sh
          ./run_z12_pipeline.sh

      - name: Optional: Run Python z12 orchestrator (non-fatal)
        working-directory: evk
        run: |
          chmod +x ./z12
          ./z12 demo || true

      - name: List generated artifacts (debug)
        working-directory: evk
        run: ls -la z12_demo_* z12_* || true

      - name: Upload Z-12 reports
        uses: actions/upload-artifact@v4
        with:
          name: z12-reports
          path: |
            evk/z12_demo_report.json
            evk/z12_demo_report.html
            evk/z12_demo_evidence.html
            evk/z12_report.json
            evk/z12_report.html
            evk/z12_evidence.html
