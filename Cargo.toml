[package]
name = "evk"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "evk"
path = "src/bin/evk.rs"

[dependencies]
postcard = "1.0"
sha2 = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
anyhow = "1.0"

serde_json = "1.0"
chrono = "0.4"


