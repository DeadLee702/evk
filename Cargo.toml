[package]
name = "evk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "EVK: Sovereign evidence pipeline for Z-12"
repository = "https://github.com/DeadLee702/evk"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
hex = "0.4"

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.1"

[[bin]]
name = "evk"
path = "src/bin/evk.rs"

[features]
default = []
# tpm = ["tss-esapi", "openssl"] # Re-enable when buyer asks for hardware

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
