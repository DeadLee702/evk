[package]
name = "evk-lib"
version = "1.0.0"
edition = "2021"

[lib]
name = "evk_lib"
path = "src/lib.rs"

[[bin]]
name = "evk"
path = "src/bin/evk.rs"

[dependencies]
sha2 = "0.10"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
serde_json = "1.0"
chrono = "0.4"
zip = "0.6"

[dev-dependencies]
assert_cmd = "2.0"
assert_fs = "1.1"
predicates = "3.0"
