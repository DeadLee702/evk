<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-12 Sovereign Security Platform — Control Plane</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const ZODIAC_ICONS = {
            Aries: "♈", Taurus: "♉", Gemini: "♊", Cancer: "♋",
            Leo: "♌", Virgo: "♍", Libra: "♎", Scorpio: "♏",
            Sagittarius: "♐", Capricorn: "♑", Aquarius: "♒", Pisces: "♓"
        };

        // Health states: PURA (healthy), VIGLA (warning), POLUITA (compromised).
        const STATUS_COLORS = {
            PURA: "bg-green-600 border-green-400",
            VIGLA: "bg-yellow-500 border-yellow-300",
            POLUITA: "bg-red-600 border-red-400 animate-pulse"
        };

        function Banner({ data }) {
            const pura = data.gauntlet_status === "ZODIAKO_GARDAS";
            return (
                <div className={`rounded-lg p-4 mb-6 border-2 ${pura ? "border-green-500 bg-green-900/30" : "border-red-500 bg-red-900/30"}`}>
                    <div className="flex flex-wrap gap-6 justify-center text-center">
                        <div><div className="text-xs uppercase text-gray-400">Verdict</div>
                            <div className={`text-2xl font-bold ${pura ? "text-green-400" : "text-red-400"}`}>{pura ? "PURA" : "MALPURA / BREACH"}</div></div>
                        <div><div className="text-xs uppercase text-gray-400">EVK Core</div>
                            <div className={`text-2xl font-bold ${data.audit_results.evk_core === "VERIFIED" ? "text-green-400" : "text-red-400"}`}>{data.audit_results.evk_core}</div></div>
                        <div><div className="text-xs uppercase text-gray-400">COP Score (risk)</div>
                            <div className={`text-2xl font-bold ${data.cop_score > 15 ? "text-red-400" : "text-green-400"}`}>{data.cop_score}%</div></div>
                        <div><div className="text-xs uppercase text-gray-400">Health</div>
                            <div className="text-2xl font-bold">{data.rooms_healthy}/{data.total_rooms}</div></div>
                    </div>
                </div>
            );
        }

        function Dashboard() {
            const [data, setData] = useState(null);
            const [err, setErr] = useState(null);
            const [selected, setSelected] = useState(null);

            const fetchHealth = async () => {
                try {
                    const res = await fetch('/api/health');
                    setData(await res.json());
                    setErr(null);
                } catch (e) { setErr(String(e)); }
            };

            useEffect(() => {
                fetchHealth();
                const interval = setInterval(fetchHealth, 30000);
                return () => clearInterval(interval);
            }, []);

            if (err) return <div className="flex h-screen items-center justify-center text-red-400">API unreachable — run: <code className="mx-2">python master_runner.py --serve</code></div>;
            if (!data) return <div className="flex h-screen items-center justify-center">Initializing Z-12…</div>;

            return (
                <div className="min-h-screen p-6 max-w-6xl mx-auto">
                    <div className="text-center mb-6">
                        <h1 className="text-4xl font-bold">Z-12 Sovereign Security Platform</h1>
                        <div className="text-sm text-gray-400 mt-1">
                            {data.platform} v{data.version} · mode {data.mode} · last scan {new Date(data.timestamp).toLocaleString()}
                        </div>
                    </div>

                    <Banner data={data} />

                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                        {data.reports.map(room => (
                            <div key={room.room}
                                 onClick={() => setSelected(room)}
                                 className={`${STATUS_COLORS[room.status]} p-5 rounded-lg border-2 cursor-pointer hover:scale-105 transition-all`}>
                                <div className="text-4xl text-center mb-1">{ZODIAC_ICONS[room.zodiac] || "●"}</div>
                                <div className="text-lg font-bold text-center capitalize">{room.room}</div>
                                <div className="text-[11px] text-center opacity-80">{room.attack_vector}</div>
                                <div className="text-center mt-2 font-mono text-sm">{room.status}</div>
                            </div>
                        ))}
                    </div>

                    {selected && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4" onClick={() => setSelected(null)}>
                            <div className="bg-gray-800 p-6 rounded-lg max-w-md w-full" onClick={e => e.stopPropagation()}>
                                <h2 className="text-2xl font-bold mb-4 capitalize">{ZODIAC_ICONS[selected.zodiac]} {selected.room} ({selected.zodiac})</h2>
                                <p><b>Attack guarded:</b> {selected.attack_vector}</p>
                                <p><b>Signature:</b> {selected.signature}</p>
                                <p><b>Benign passes:</b> {String(selected.benign_pass)}</p>
                                <p><b>Malicious blocked:</b> {String(selected.malicious_blocked)}</p>
                                <p><b>Status:</b> <span className={selected.status === "PURA" ? "text-green-400" : "text-red-400"}>{selected.status}</span></p>
                                <p><b>Last check:</b> {new Date(selected.last_check).toLocaleString()}</p>
                                <button className="mt-4 bg-blue-600 px-4 py-2 rounded" onClick={() => setSelected(null)}>Close</button>
                            </div>
                        </div>
                    )}

                    <div className="text-center text-xs text-gray-500 mt-8">
                        Business logic runs in backend services; this dashboard is visualization + operator control only. Relenthol engaĝita.
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
